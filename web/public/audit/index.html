<!-- Copied from https://github.com/Aditya-Patil27/samvad dashboard/index.html and pointed at
     artifacts/ via ./frames.json (scripts/export_audit_frames.py). Differences from upstream:
     PEERS, the brand and title, <base href="/audit/">, and live() replaced by replay(); the
     synthetic demo() is removed. Served at /audit by a Next rewrite; it does not work from
     file:// because the frames fetch is relative to /audit/.

     THIS IS AN AUDIT CONSOLE, not a traffic diagram. The column that matters is EVIDENCE:
     every claim carries an evidence_type, and model_prior means nothing ran. -->
<!doctype html>
<meta charset="utf-8">
<!-- Served at /audit via a Next.js rewrite (web/next.config.ts), so the browser's address
     bar stays "/audit" with no trailing slash -- without this <base>, the relay's
     `fetch("./frames.json")` would resolve against "/" instead of "/audit/" and 404. -->
<base href="/audit/">
<title>Assay · audit console</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root {
    --bg:        #f4f5f7;
    --panel:     #ffffff;
    --sunk:      #eceef1;
    --line:      #dcdfe4;
    --ink:       #16191d;
    --ink-2:     #454b54;
    --muted:     #6d747e;
    --accent:    #1f5fbf;
    --accent-bg: #e8f0fc;

    --ok:      #0d7a53;   --ok-bg:   #e2f3ec;
    --warn:    #9a6205;   --warn-bg: #fbf0dc;
    --bad:     #b02418;   --bad-bg:  #fbeae8;
    --idle:    #6d747e;   --idle-bg: #eceef1;

    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:        #14171b;
      --panel:     #1b1f24;
      --sunk:      #22272d;
      --line:      #2f353c;
      --ink:       #e7eaee;
      --ink-2:     #b9c0c9;
      --muted:     #868e99;
      --accent:    #6aa5f0;
      --accent-bg: #17263a;

      --ok:      #4cc38f;  --ok-bg:   #102b21;
      --warn:    #e0a33e;  --warn-bg: #2e2411;
      --bad:     #f0796c;  --bad-bg:  #331916;
      --idle:    #868e99;  --idle-bg: #22272d;
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font: 13px/1.45 var(--sans);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

  /* ---- top bar ---- */
  header {
    display: flex; align-items: center; gap: 18px;
    padding: 0 16px; height: 48px;
    background: var(--panel); border-bottom: 1px solid var(--line); flex: none;
  }
  .brand { font-weight: 700; font-size: 14px; letter-spacing: .02em; }
  .brand small { font-weight: 500; color: var(--muted); letter-spacing: .06em;
                 text-transform: uppercase; font-size: 10.5px; margin-left: 8px; }
  .kpis { margin-left: auto; display: flex; gap: 26px; align-items: center; }
  .kpi { text-align: right; }
  .kpi .v { font: 600 16px/1.1 var(--mono); font-variant-numeric: tabular-nums; display: block; }
  .kpi .k { font-size: 10px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
  .badge {
    font: 600 10px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase;
    padding: 4px 8px; border-radius: 3px; background: var(--idle-bg); color: var(--idle);
  }
  .badge.live { background: var(--ok-bg); color: var(--ok); }

  /* ---- layout ---- */
  .shell { flex: 1; display: grid; grid-template-columns: 232px 1fr; min-height: 0; }

  /* ---- roster ---- */
  aside {
    background: var(--panel); border-right: 1px solid var(--line);
    overflow-y: auto; min-height: 0;
  }
  .aside-h {
    font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted);
    padding: 12px 14px 8px;
  }
  .agent {
    padding: 10px 14px; border-bottom: 1px solid var(--line);
    cursor: pointer; display: grid; gap: 5px;
  }
  .agent:hover { background: var(--sunk); }
  .agent.sel { background: var(--accent-bg); box-shadow: inset 3px 0 0 var(--accent); }
  .agent-top { display: flex; align-items: center; gap: 7px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); flex: none; }
  .agent.down .dot { background: var(--bad); }
  .agent.down .name { color: var(--muted); text-decoration: line-through; }
  .name { font-weight: 600; font-family: var(--mono); }
  .role { margin-left: auto; font-size: 10.5px; color: var(--muted); text-transform: uppercase;
          letter-spacing: .05em; }
  .agent-meta { font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; }
  .track { height: 3px; background: var(--sunk); border-radius: 2px; overflow: hidden; }
  .track i { display: block; height: 100%; background: var(--accent); }
  .track i.hot { background: var(--warn); }
  .track i.full { background: var(--bad); }

  /* ---- main ---- */
  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .filters {
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    padding: 9px 14px; background: var(--panel); border-bottom: 1px solid var(--line); flex: none;
  }
  select, input[type=search] {
    font: 12px var(--sans); color: var(--ink); background: var(--panel);
    border: 1px solid var(--line); border-radius: 4px; padding: 5px 8px;
  }
  input[type=search] { flex: 1; min-width: 120px; max-width: 280px; }
  select:focus-visible, input:focus-visible, .agent:focus-visible, tbody tr:focus-visible {
    outline: 2px solid var(--accent); outline-offset: -2px;
  }
  .count { margin-left: auto; font-size: 11.5px; color: var(--muted); }
  .btn {
    font: 12px var(--sans); color: var(--ink-2); background: var(--panel);
    border: 1px solid var(--line); border-radius: 4px; padding: 5px 9px; cursor: pointer;
  }
  .btn:hover { background: var(--sunk); }

  .tablewrap { flex: 1; overflow: auto; min-height: 0; }
  table { width: 100%; border-collapse: collapse; }
  thead th {
    position: sticky; top: 0; z-index: 1; text-align: left;
    font: 600 10px/1 var(--mono); letter-spacing: .09em; text-transform: uppercase;
    color: var(--muted); background: var(--sunk);
    padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap;
  }
  tbody td { padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: var(--sunk); }
  tbody tr.sel { background: var(--accent-bg); }
  tbody tr.new td { animation: flash 1.1s ease-out; }
  @keyframes flash { from { background: var(--accent-bg); } }
  td.num { font-family: var(--mono); color: var(--muted); white-space: nowrap; }
  td.who { font-family: var(--mono); white-space: nowrap; }
  td.who .arrow { color: var(--muted); margin: 0 4px; }
  .pill {
    display: inline-block; font: 600 10px/1.5 var(--mono); letter-spacing: .04em;
    padding: 1px 6px; border-radius: 3px; white-space: nowrap;
  }
  .pill.ok   { background: var(--ok-bg);   color: var(--ok); }
  .pill.warn { background: var(--warn-bg); color: var(--warn); }
  .pill.bad  { background: var(--bad-bg);  color: var(--bad); }
  .pill.idle { background: var(--idle-bg); color: var(--idle); }
  .ev { display: flex; gap: 3px; flex-wrap: wrap; }
  .ev .none { color: var(--muted); }
  .empty { padding: 40px 16px; text-align: center; color: var(--muted); }

  /* ---- detail ---- */
  .detail {
    flex: none; max-height: 45%; overflow-y: auto;
    background: var(--panel); border-top: 2px solid var(--accent);
  }
  .detail[hidden] { display: none; }
  .d-head {
    display: flex; align-items: baseline; gap: 12px; padding: 10px 14px;
    border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel);
  }
  .d-head b { font-size: 13px; }
  .d-head .id { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .d-head .close { margin-left: auto; }
  .d-body { padding: 12px 14px; display: grid; gap: 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px 18px; }
  .f .k { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .f .v { font-family: var(--mono); font-size: 12px; word-break: break-all; }
  .sec-h {
    font-size: 10px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted);
    border-bottom: 1px solid var(--line); padding-bottom: 4px; margin-bottom: 7px;
  }
  .claim { display: grid; gap: 2px; padding: 7px 0; border-bottom: 1px solid var(--line); }
  .claim:last-child { border-bottom: 0; }
  .claim .c { font-weight: 600; }
  .claim .e { font-size: 11.5px; color: var(--muted); font-family: var(--mono); }
  .rt { background: var(--sunk); border-left: 3px solid var(--accent); padding: 8px 10px;
        border-radius: 0 3px 3px 0; }
  pre { font: 11.5px/1.5 var(--mono); background: var(--sunk); padding: 9px 11px;
        border-radius: 4px; overflow-x: auto; }
  footer {
    flex: none; display: flex; gap: 18px; padding: 6px 14px;
    background: var(--panel); border-top: 1px solid var(--line);
    font-size: 11px; color: var(--muted);
  }
  @media (max-width: 720px) {
    .shell { grid-template-columns: 1fr; }
    aside { display: none; }
  }
</style>

<header>
  <span class="brand">ASSAY<small>audit console · artifacts/</small></span>
  <span class="badge" id="mode">connecting</span>
  <div class="kpis">
    <div class="kpi"><span class="v" id="k-grounded">—</span><span class="k">grounded</span></div>
    <div class="kpi"><span class="v" id="k-msgs">0</span><span class="k">actions</span></div>
    <div class="kpi"><span class="v" id="k-lam">0</span><span class="k">lamport</span></div>
    <div class="kpi"><span class="v" id="k-usd">$0.0000</span><span class="k">spend</span></div>
  </div>
</header>

<div class="shell">
  <aside>
    <div class="aside-h">Agents</div>
    <div id="roster"></div>
  </aside>

  <main>
    <div class="filters">
      <select id="f-agent"><option value="">All agents</option></select>
      <select id="f-act"><option value="">All actions</option></select>
      <select id="f-ev">
        <option value="">Any evidence</option>
        <option value="grounded">Grounded only</option>
        <option value="model_prior">Contains model_prior</option>
        <option value="none">No claims</option>
      </select>
      <input type="search" id="f-q" placeholder="Search task, claim, id…">
      <button class="btn" id="f-clear">Clear</button>
      <span class="count" id="count"></span>
    </div>

    <div class="tablewrap">
      <table>
        <thead><tr>
          <th>Lamport</th><th>Agent → Target</th><th>Action</th>
          <th>Status</th><th>Evidence</th><th>Task</th><th style="text-align:right">Cost</th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="empty" id="empty" hidden>No actions match these filters.</div>
    </div>

    <section class="detail" id="detail" hidden aria-live="polite">
      <div class="d-head">
        <b id="d-title">—</b><span class="id" id="d-id"></span>
        <button class="btn close" id="d-close">Close</button>
      </div>
      <div class="d-body" id="d-body"></div>
    </section>

    <footer>
      <span>ordered by <b>lamport clock</b>, not wall time</span>
      <span id="hint"></span>
    </footer>
  </main>
</div>

<script>
"use strict";

const PEERS = ["assay", "reviewer"];
const GROUNDED = new Set(["test_output", "file_content"]);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

const state = {
  rows: [], usd: 0, lamport: 0, claims: 0, grounded: 0, sel: null,
  nodes: Object.fromEntries(PEERS.map(p => [p, {
    model: "—", role: "", up: true, used: 0, limit: 200000, children: 0, budget: 0, acts: 0
  }])),
  filter: { agent: "", act: "", ev: "", q: "" }
};

const peerOf = a => String(a || "").split("/")[0];

/* ---- evidence: the column this console exists for --------------------- */
function evidence(m) {
  const claims = m.claims || [];
  if (!claims.length) return { n: 0, grounded: 0, prior: 0, other: 0 };
  let g = 0, p = 0, o = 0;
  for (const c of claims) {
    if (GROUNDED.has(c.evidence_type)) g++;
    else if (c.evidence_type === "model_prior") p++;
    else o++;
  }
  return { n: claims.length, grounded: g, prior: p, other: o };
}

const STATUS_CLASS = {
  complete: "ok", in_progress: "idle", pending: "idle",
  needs_revision: "warn", uncertain: "warn", abandoned: "bad"
};
const ACTION_CLASS = {
  spawn_refused: "bad", budget_exhausted: "bad", uncertain: "warn",
  task_result: "ok", child_result: "ok"
};

/* ---- roster ----------------------------------------------------------- */
function drawRoster() {
  $("roster").innerHTML = PEERS.map(p => {
    const n = state.nodes[p];
    const pct = n.limit ? Math.min(100, n.used / n.limit * 100) : 0;
    const cls = pct > 90 ? "full" : pct > 70 ? "hot" : "";
    return `<div class="agent ${n.up ? "" : "down"} ${state.filter.agent === p ? "sel" : ""}"
                 data-agent="${p}" tabindex="0" role="button">
      <div class="agent-top"><span class="dot"></span><span class="name">${p}</span>
        <span class="role">${esc(n.role)}</span></div>
      <div class="agent-meta"><span>${esc(n.model)}</span><span>${n.acts} acts</span></div>
      <div class="track"><i class="${cls}" style="width:${pct.toFixed(1)}%"></i></div>
      <div class="agent-meta"><span>ctx ${(n.used / 1000).toFixed(1)}k</span>
        <span>$${n.budget.toFixed(3)}</span></div>
    </div>`;
  }).join("");
}

/* ---- filters ---------------------------------------------------------- */
function matches(r) {
  const f = state.filter;
  if (f.agent && peerOf(r.sender) !== f.agent && peerOf(r.receiver) !== f.agent) return false;
  if (f.act && r.performative !== f.act) return false;
  if (f.ev === "grounded"     && !(r.ev.n && r.ev.prior === 0)) return false;
  if (f.ev === "model_prior"  && !r.ev.prior) return false;
  if (f.ev === "none"         && r.ev.n) return false;
  if (f.q) {
    const hay = [r.root_task, r.message_id, r.conversation_id, r.performative,
      ...(r.claims || []).map(c => c.claim + " " + c.evidence)].join(" ").toLowerCase();
    if (!hay.includes(f.q.toLowerCase())) return false;
  }
  return true;
}

function drawRows(newest) {
  const shown = state.rows.filter(matches);
  $("count").textContent = `${shown.length} of ${state.rows.length} actions`;
  $("empty").hidden = shown.length > 0;

  $("rows").innerHTML = shown.map(r => {
    const ev = r.ev;
    const evHtml = ev.n === 0
      ? `<span class="none">—</span>`
      : `${ev.grounded ? `<span class="pill ok">${ev.grounded} grounded</span>` : ""}
         ${ev.prior ? `<span class="pill warn">${ev.prior} prior</span>` : ""}
         ${ev.other ? `<span class="pill idle">${ev.other} peer</span>` : ""}`;
    return `<tr data-i="${r.i}" tabindex="0" class="${r.i === state.sel ? "sel" : ""} ${r.i === newest ? "new" : ""}">
      <td class="num">${r.lamport}</td>
      <td class="who">${esc(r.sender)}<span class="arrow">→</span>${esc(r.receiver)}</td>
      <td><span class="pill ${ACTION_CLASS[r.performative] || "idle"}">${esc(r.performative)}</span></td>
      <td>${r.task_status ? `<span class="pill ${STATUS_CLASS[r.task_status] || "idle"}">${esc(r.task_status)}</span>` : `<span class="num">—</span>`}</td>
      <td><div class="ev">${evHtml}</div></td>
      <td>${esc((r.root_task || "").slice(0, 46))}${(r.root_task || "").length > 46 ? "…" : ""}</td>
      <td class="num" style="text-align:right">${r.cost?.usd ? "$" + r.cost.usd.toFixed(4) : "—"}</td>
    </tr>`;
  }).join("");
}

/* ---- detail ----------------------------------------------------------- */
function field(k, v) { return `<div class="f"><div class="k">${k}</div><div class="v">${esc(v)}</div></div>`; }

function openDetail(i) {
  const r = state.rows.find(x => x.i === i);
  if (!r) return;
  state.sel = i;
  $("d-title").textContent = `${r.sender} → ${r.receiver} · ${r.performative}`;
  $("d-id").textContent = r.message_id || `lamport ${r.lamport}`;

  const parts = [];
  if (r.root_task) parts.push(`<div class="rt"><div class="k" style="font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)">Root task — immutable for the conversation</div>${esc(r.root_task)}</div>`);

  parts.push(`<div class="grid">
    ${field("Lamport", r.lamport)}
    ${field("Turn", r.turn ?? "—")}
    ${field("Conversation", r.conversation_id || "—")}
    ${field("Status", r.task_status || "—")}
    ${field("Timestamp", r.timestamp || "—")}
    ${field("Reply to", r.reply_to || "—")}
    ${r.spawn ? field("Depth", `${r.spawn.depth} / max ${r.spawn.max_depth}`) : ""}
    ${r.budget ? field("Budget left", `$${Number(r.budget.usd_remaining).toFixed(4)} · ${r.budget.turns_remaining} turns`) : ""}
    ${r.context ? field("Context", `${(r.context.used / 1000).toFixed(1)}k / ${(r.context.limit / 1000).toFixed(0)}k`) : ""}
    ${r.cost ? field("Cost", `$${Number(r.cost.usd).toFixed(4)} · ${r.cost.model || ""}`) : ""}
    ${field("Signature", r.sig ? r.sig.slice(0, 24) + "…" : "unsigned")}
  </div>`);

  const claims = r.claims || [];
  if (claims.length) {
    parts.push(`<div><div class="sec-h">Claims — ${r.ev.grounded} grounded, ${r.ev.prior} model_prior</div>` +
      claims.map(c => {
        const g = GROUNDED.has(c.evidence_type);
        const cls = g ? "ok" : c.evidence_type === "model_prior" ? "warn" : "idle";
        return `<div class="claim"><div class="c">${esc(c.claim)}</div>
          <div class="e">${esc(c.evidence)}</div>
          <div><span class="pill ${cls}">${esc(c.evidence_type)}</span>
          ${c.evidence_type === "model_prior" ? `<span class="e"> nothing ran — not grounded</span>` : ""}</div></div>`;
      }).join("") + `</div>`);
  }

  const arts = r.artifacts || [];
  if (arts.length) {
    parts.push(`<div><div class="sec-h">Artifacts — travel as refs, never inline bytes</div>` +
      arts.map(a => `<div class="claim"><div class="c">${esc(a.summary)}</div>
        <div class="e">${esc(a.ref)}</div>
        <div><span class="pill idle">${esc(a.kind)}</span> <span class="e">${a.tokens} tokens to hydrate</span></div>
      </div>`).join("") + `</div>`);
  }

  if (r.payload && Object.keys(r.payload).length)
    parts.push(`<div><div class="sec-h">Payload</div><pre>${esc(JSON.stringify(r.payload, null, 2))}</pre></div>`);

  $("d-body").innerHTML = parts.join("");
  $("detail").hidden = false;
  drawRows();
}

/* ---- ingest ----------------------------------------------------------- */
function onMessage(m) {
  const r = { ...m, i: state.rows.length, ev: evidence(m) };
  state.rows.push(r);
  state.lamport = Math.max(state.lamport, m.lamport || 0);
  state.usd += m.cost?.usd || 0;
  state.claims += r.ev.n;
  state.grounded += r.ev.grounded;

  const p = peerOf(m.sender);
  if (state.nodes[p]) state.nodes[p].acts++;

  $("k-lam").textContent = state.lamport;
  $("k-msgs").textContent = state.rows.length;
  $("k-usd").textContent = "$" + state.usd.toFixed(4);
  $("k-grounded").textContent = state.claims ? Math.round(state.grounded / state.claims * 100) + "%" : "—";

  const opts = new Set(state.rows.map(x => x.performative));
  const sel = $("f-act");
  if (sel.options.length - 1 !== opts.size) {
    const cur = sel.value;
    sel.innerHTML = `<option value="">All actions</option>` +
      [...opts].sort().map(o => `<option value="${o}">${o}</option>`).join("");
    sel.value = cur;
  }
  drawRows(r.i);
  drawRoster();
}

function onNode(n) {
  const s = state.nodes[n.agent];
  if (!s) return;
  Object.assign(s, {
    model: n.model ?? s.model, up: n.up ?? s.up, role: n.role ?? s.role,
    children: n.children ?? s.children, used: n.context?.used ?? s.used,
    limit: n.context?.limit ?? s.limit, budget: n.budget_usd ?? s.budget
  });
  drawRoster();
}

const ingest = e => (e.type === "node" ? onNode : onMessage)(e);

/* ---- events ----------------------------------------------------------- */
document.addEventListener("click", e => {
  const a = e.target.closest(".agent");
  if (a) { state.filter.agent = state.filter.agent === a.dataset.agent ? "" : a.dataset.agent;
           $("f-agent").value = state.filter.agent; drawRoster(); drawRows(); return; }
  const tr = e.target.closest("tbody tr");
  if (tr) openDetail(+tr.dataset.i);
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { $("detail").hidden = true; state.sel = null; drawRows(); }
  if (e.key !== "Enter") return;
  const a = document.activeElement;
  if (a?.classList.contains("agent")) a.click();
  else if (a?.closest("tbody tr")) openDetail(+a.closest("tbody tr").dataset.i);
});
$("d-close").onclick = () => { $("detail").hidden = true; state.sel = null; drawRows(); };
for (const [id, key] of [["f-agent","agent"], ["f-act","act"], ["f-ev","ev"], ["f-q","q"]])
  $(id).addEventListener("input", e => { state.filter[key] = e.target.value; drawRoster(); drawRows(); });
$("f-clear").onclick = () => {
  state.filter = { agent: "", act: "", ev: "", q: "" };
  $("f-agent").value = $("f-act").value = $("f-ev").value = $("f-q").value = "";
  drawRoster(); drawRows();
};

/* ---- live, or synthetic ---------------------------------------------- */
/* Replay artifacts/ as frames. No /events here: the run already happened, and the file
   is what it produced. 400 ms per row so the grounded ratio is seen to be computed. */
async function replay() {
  let frames;
  try {
    const res = await fetch("./frames.json", { cache: "no-store" });
    if (!res.ok) throw new Error(String(res.status));
    frames = await res.json();
  } catch (e) {
    $("mode").textContent = "no data";
    $("hint").textContent = "frames.json did not load — run: python scripts/export_audit_frames.py";
    return;
  }
  $("mode").textContent = "artifacts";
  $("mode").classList.add("live");
  $("hint").textContent = "replaying artifacts/ — placeholder:false is grounded, anything else is not";
  for (const n of frames.nodes) onNode(n);
  let i = 0;
  (function step() {
    if (i >= frames.messages.length) { $("hint").textContent += " · run complete"; return; }
    onMessage(frames.messages[i++]);
    setTimeout(step, 400);
  })();
}

drawRoster();
replay();
</script>
