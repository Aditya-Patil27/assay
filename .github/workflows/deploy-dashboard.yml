# Publishes the static dashboard to GitHub Pages.
#
# Requirement #3 of the submission is "a working web prototype", and it is graded. Before
# this existed, deploying was an unperformed manual step with no fallback: the export was
# built on one laptop and never given an address a judge could open.
#
# One-time human step, because it makes the page public:
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
# After that every push to main republishes, and the URL is stable.
#
# BASE_PATH matters. Pages serves from /<repo>/, and next.config.ts switches asset URLs to
# the absolute form when it is set. Without it every /_next/... request 404s and a judge
# gets unstyled HTML.
name: Deploy dashboard

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "artifacts/**"
      - ".github/workflows/deploy-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; a half-published dashboard is worse than a stale one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      # prebuild runs `npm run sync`, which copies committed artifacts/ into
      # web/public/data. The dashboard therefore ships whatever the repo holds -- it never
      # trains, and it cannot invent a number that is not in a committed artifact.
      - name: Build static export
        working-directory: web
        env:
          BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      - name: Fail if the export is empty
        working-directory: web
        run: test -s out/index.html || { echo "out/index.html missing or empty"; exit 1; }

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
