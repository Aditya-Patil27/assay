# Run the checks that already exist.
#
# The repo had 92 Python tests and two cross-language conformance proofs, and nothing ran
# them on push. A guarantee nobody enforces is not a guarantee: the conformance checks are
# the reason the browser demo can be cited as evidence for the measured results, and until
# now they held only for as long as someone remembered to type the command.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: uv pip install --system -e ".[dev]"
      - name: Tests
        run: pytest -q

  web:
    name: typecheck, build, conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Typecheck
        working-directory: web
        run: npm run typecheck

      # The two checks that make the live demo admissible as evidence. If the browser
      # detector and the Python one disagree, or the TypeScript defence port disagrees with
      # the Python control, then the interactive page is demonstrating something other than
      # what the artifacts report -- and the whole submission rests on those agreeing.
      - name: Detector port matches ONNX
        working-directory: web
        run: npm run check:trees
      - name: Agent port matches Python
        working-directory: web
        run: npm run check:agent

      # The only server code in the repo. These are the paths that run when someone is
      # probing or abusing the endpoint, which is exactly when nobody is watching.
      - name: Route guards
        working-directory: web
        run: npm run check:route

      - name: Build
        working-directory: web
        run: npm run build

  artifacts:
    name: no placeholders in published results
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The rule the whole project rests on, enforced rather than trusted: a result artifact
      # carrying placeholder:true is seed data, and it must never reach a reader as a number.
      - name: Assert every result artifact is real
        run: |
          python - <<'PY'
          import glob, json, sys
          bad = []
          for path in sorted(glob.glob("artifacts/**/*.json", recursive=True)):
              if "cache" in path:
                  continue
              try:
                  data = json.load(open(path, encoding="utf-8"))
              except Exception as exc:
                  bad.append(f"{path}: unreadable ({exc})")
                  continue
              if isinstance(data, dict) and data.get("placeholder") is True:
                  bad.append(f"{path}: placeholder:true")
          if bad:
              print("\n".join(bad))
              sys.exit(1)
          print("all result artifacts carry placeholder:false")
          PY
